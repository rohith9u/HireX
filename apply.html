<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Apply Job</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<style>
@media (max-width: 768px) {
  .topbar { height: 56px; }
  .layout { margin-top: 56px; }
}

/* ✅ Loading spinner for resume analysis */
#analysisBox .analyzing {
  display: flex;
  align-items: center;
  gap: 10px;
  color: #94a3b8;
  font-size: 14px;
  padding: 10px 0;
}
#analysisBox .analyzing::before {
  content: "";
  width: 16px;
  height: 16px;
  border: 2px solid #334155;
  border-top-color: #6366f1;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ✅ Submit button disabled state */
.apply-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
}
</style>
</head>

<body>

<!-- TOPBAR -->
<div class="topbar">
    <img src="images/logo.png" class="logo-img">
    <div class="top-actions">
        <i class="ri-notification-3-line icon"></i>
        <div class="profile-top">
            <i class="ri-user-3-line"></i>
            <span id="topbarName">User</span>
        </div>
        <i class="ri-logout-box-r-line icon" onclick="logout()"></i>
    </div>
</div>

<div class="layout">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="brand">
            <i class="ri-briefcase-line"></i>
            <span>JobPortal</span>
        </div>
        <a href="dashboard.html">
            <i class="ri-dashboard-line"></i>
            <span>Dashboard</span>
        </a>
        <a href="dashboard.html#jobs">
            <i class="ri-briefcase-2-line"></i>
            <span>Jobs</span>
        </a>
        <a href="dashboard.html#applications">
            <i class="ri-file-list-3-line"></i>
            <span>Applications</span>
        </a>
        <a href="dashboard.html#profile">
            <i class="ri-user-3-line"></i>
            <span>Profile</span>
        </a>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main">
        <div class="job-card-premium apply-card">

            <h2>Apply for Job</h2>

            <div class="form-container">
                <div class="left-fields">

                    <input id="name" type="text" placeholder="Full Name" required>

                    <input id="email" type="email" placeholder="Loading email..."
                           readonly style="opacity:0.6; cursor:not-allowed; background:#1e293b;">

                    <input id="phone" type="tel" placeholder="Phone Number"
                           required pattern="[0-9]{10}" maxlength="10">

                    <input id="city" type="text" placeholder="City" required>

                    <input id="degree" type="text" placeholder="Highest Qualification" required>

                    <input id="experience" type="number"
                           placeholder="Experience (years)" min="0" max="50" required>

                    <input id="skills" type="text"
                           placeholder="Skills (e.g. Java, React)" required>

                    <!-- ✅ Resume upload with clear label -->
                    <label style="color:#94a3b8; font-size:13px; margin-bottom:4px; display:block;">
                        Upload Resume (PDF only) <span style="color:#ef4444;">*</span>
                    </label>
                    <input type="file" id="resumeInput" accept="application/pdf" required>

                    <!-- ✅ Analysis result box -->
                    <div id="analysisBox" style="margin-top:15px;"></div>

                </div>
            </div>

            <!-- ✅ Submit button — disabled until resume is analyzed -->
            <button class="apply-btn" id="submitBtn" onclick="submitApplication()" disabled>
                Submit Application
            </button>

            <p id="msg" style="margin-top:10px;"></p>

        </div>
    </div>

</div>

<!-- 📱 BOTTOM NAV -->
<div class="bottom-nav">
    <div class="nav-item" onclick="window.location.href='dashboard.html'">
        <i class="ri-dashboard-line"></i>
        <span>Home</span>
    </div>
    <div class="nav-item" onclick="window.location.href='dashboard.html'">
        <i class="ri-briefcase-2-line"></i>
        <span>Jobs</span>
    </div>
    <div class="nav-item active">
        <i class="ri-file-add-line"></i>
        <span>Apply</span>
    </div>
    <div class="nav-item" onclick="window.location.href='dashboard.html'">
        <i class="ri-user-3-line"></i>
        <span>Profile</span>
    </div>
</div>

<script>
// =============================================
// ✅ STATE
// =============================================
let analyzedData = null;

// =============================================
// ✅ ON LOAD — fetch user profile and pre-fill
// =============================================
window.addEventListener("DOMContentLoaded", async () => {
    let sessionUser = JSON.parse(localStorage.getItem("loggedInUser") || "null");

    if (!sessionUser) {
        window.location.replace("index.html");
        return;
    }

    let userEmail = localStorage.getItem("userEmail") || sessionUser.email || "";

    try {
        let res = await fetch(`https://hirex-backend-sio8.onrender.com/profile/${userEmail}`);
        let user = await res.json();

        if (user && !user.error) {
            // ✅ Fill email — readonly
            document.getElementById("email").value = user.email || userEmail;

            // ✅ Pre-fill name
            let fullName = ((user.profile?.firstName || user.firstName || "") + " " + (user.profile?.lastName || user.lastName || "")).trim();
            if (fullName) {
                document.getElementById("name").value = fullName;
                // ✅ Update topbar name
                document.getElementById("topbarName").textContent = user.firstName || "User";
            }

            // ✅ Pre-fill city
            if (user.profile?.location) document.getElementById("city").value = user.profile.location;

            // ✅ Pre-fill phone
            if (user.profile?.phone) document.getElementById("phone").value = user.profile.phone;

        } else {
            // Fallback to localStorage
            document.getElementById("email").value = userEmail;
            let fullName = ((sessionUser.firstName || "") + " " + (sessionUser.lastName || "")).trim();
            if (fullName) document.getElementById("name").value = fullName;
            document.getElementById("topbarName").textContent = sessionUser.firstName || "User";
        }
    } catch (err) {
        console.log("Error fetching profile:", err);
        document.getElementById("email").value = userEmail;
        document.getElementById("topbarName").textContent = sessionUser.firstName || "User";
    }
});

// =============================================
// ✅ RESUME ANALYSIS — triggered on file select
// =============================================
document.getElementById("resumeInput").addEventListener("change", function() {
    if (this.files && this.files[0]) {
        let file = this.files[0];

        // ✅ Client-side validation before PDF.js
        if (file.type !== "application/pdf") {
            showAnalysisError("Only PDF files are allowed. Please upload a .pdf resume.");
            this.value = "";
            return;
        }
        if (file.size > 5 * 1024 * 1024) {
            showAnalysisError("File is too large (max 5MB). Please compress your PDF.");
            this.value = "";
            return;
        }

        analyzeResume();
    }
});

// Re-analyze if skills or experience are updated manually
document.getElementById("skills").addEventListener("input", () => {
    if (document.getElementById("resumeInput").files[0]) analyzeResume();
});
document.getElementById("experience").addEventListener("input", () => {
    if (document.getElementById("resumeInput").files[0]) analyzeResume();
});

// =============================================
// ✅ CORE: analyzeResume — sets analyzedData + enables submit
// =============================================
async function analyzeResume() {
    let file = document.getElementById("resumeInput").files[0];
    if (!file) return;

    // Show loading
    document.getElementById("analysisBox").innerHTML = `<div class="analyzing">Analyzing resume...</div>`;
    document.getElementById("submitBtn").disabled = true;
    analyzedData = null;

    try {
        // Extract text from PDF via PDF.js
        let arrayBuffer = await file.arrayBuffer();
        let typedArray = new Uint8Array(arrayBuffer);
        let pdf = await pdfjsLib.getDocument(typedArray).promise;

        let text = "";
        for (let i = 1; i <= pdf.numPages; i++) {
            let page = await pdf.getPage(i);
            let content = await page.getTextContent();
            text += content.items.map(item => item.str).join(" ") + " ";
        }

        // Extract skills & experience from resume text
        let resumeSkills = extractSkills(text);
        let resumeExp = extractExperience(text);

        // Merge with manually entered values
        let formSkills = document.getElementById("skills").value
            .toLowerCase().split(",").map(s => s.trim()).filter(Boolean);
        let userSkills = [...new Set([...resumeSkills, ...formSkills])];

        let formExp = parseInt(document.getElementById("experience").value) || 0;
        let userExp = Math.max(resumeExp, formExp);

        // Fetch the target job
        let jobId = localStorage.getItem("selectedJobId");
        if (!jobId) {
            showAnalysisError("No job selected. Please go back and select a job.");
            return;
        }

        let jobs = await fetch("https://hirex-backend-sio8.onrender.com/jobs").then(r => r.json());
        let job = jobs.find(j => j._id == jobId);

        if (!job) {
            showAnalysisError("Job not found. Please go back and reselect.");
            return;
        }

        let jobSkills = Array.isArray(job.skills)
            ? job.skills.map(s => s.trim().toLowerCase())
            : (job.skills || "").toLowerCase().split(",").map(s => s.trim()).filter(Boolean);
        let jobExp = parseInt(job.experience) || 0;

        let matched = jobSkills.filter(skill => userSkills.map(s => s.toLowerCase()).includes(skill));
        let missing  = jobSkills.filter(skill => !userSkills.map(s => s.toLowerCase()).includes(skill));

        let skillScore = jobSkills.length > 0 ? (matched.length / jobSkills.length) * 100 : 0;
        let expScore   = userExp >= jobExp ? 100 : jobExp > 0 ? (userExp / jobExp) * 100 : 100;

        // Weighted final score (only if at least 1 skill matched)
        let finalScore = 0;
        if (matched.length > 0 && skillScore >= 30) {
            finalScore = (0.7 * skillScore) + (0.3 * expScore);
        }

        // ✅ Store analyzed data
        analyzedData = {
            skills: userSkills,
            experience: userExp,
            match: parseFloat(finalScore.toFixed(1)),
            matchedSkills: matched,
            missingSkills: missing
        };

        // ✅ Show result
        let scoreColor = finalScore >= 70 ? "#22c55e" : finalScore >= 40 ? "#f59e0b" : "#ef4444";
        document.getElementById("analysisBox").innerHTML = `
            <div style="background:#1e293b; border-radius:10px; padding:14px; border-left:3px solid ${scoreColor};">
                <h3 style="color:${scoreColor}; margin:0 0 10px;">
                    Match Score: ${finalScore.toFixed(1)}%
                </h3>
                <p style="margin:4px 0; font-size:13px; color:#94a3b8;">
                    <b style="color:#e2e8f0;">✅ Matched Skills:</b>
                    ${matched.length > 0 ? matched.join(", ") : "None"}
                </p>
                <p style="margin:4px 0; font-size:13px; color:#94a3b8;">
                    <b style="color:#e2e8f0;">⚠️ Missing Skills:</b>
                    ${missing.length > 0 ? missing.join(", ") : "None"}
                </p>
                <p style="margin:4px 0; font-size:13px; color:#94a3b8;">
                    <b style="color:#e2e8f0;">🕒 Experience:</b>
                    ${userExp} yr${userExp !== 1 ? "s" : ""} / Required: ${jobExp} yr${jobExp !== 1 ? "s" : ""}
                </p>
            </div>
        `;

        // ✅ Enable submit button now that resume is analyzed
        document.getElementById("submitBtn").disabled = false;

    } catch (err) {
        console.error("Resume analysis error:", err);
        showAnalysisError("Could not read PDF. Please ensure it's a valid PDF file.");
    }
}

function showAnalysisError(msg) {
    document.getElementById("analysisBox").innerHTML =
        `<p style="color:#ef4444; font-size:13px;">❌ ${msg}</p>`;
    document.getElementById("submitBtn").disabled = true;
    analyzedData = null;
}

// =============================================
// ✅ SUBMIT APPLICATION
// =============================================
function submitApplication() {
    let name       = document.getElementById("name").value.trim();
    let email      = document.getElementById("email").value.trim();
    let phone      = document.getElementById("phone").value.trim();
    let city       = document.getElementById("city").value.trim();
    let degree     = document.getElementById("degree").value.trim();
    let experience = document.getElementById("experience").value.trim();
    let skills     = document.getElementById("skills").value.trim();
    let resumeFile = document.getElementById("resumeInput").files[0];
    let jobId      = localStorage.getItem("selectedJobId");
    let msg        = document.getElementById("msg");

    // ✅ Guard: analyzedData must exist
    if (!analyzedData) {
        msg.style.color = "red";
        msg.innerText = "Please upload and wait for resume analysis ❌";
        return;
    }

    // ✅ Phone validation
    if (!/^[0-9]{10}$/.test(phone)) {
        msg.style.color = "red";
        msg.innerText = "Enter a valid 10-digit phone number ❌";
        return;
    }

    // ✅ All fields check
    if (!name || !email || !phone || !city || !degree || !experience || !skills || !resumeFile) {
        msg.style.color = "red";
        msg.innerText = "Please fill all fields ❌";
        return;
    }

    if (!jobId) {
        msg.style.color = "red";
        msg.innerText = "No job selected. Go back and select a job ❌";
        return;
    }

    // ✅ Disable button to prevent double submit
    let btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.innerText = "Submitting...";

    let formData = new FormData();
    formData.append("name", name);
    formData.append("email", email);
    formData.append("phone", phone);
    formData.append("city", city);
    formData.append("degree", degree);
    formData.append("skills", analyzedData.skills.join(", "));
    formData.append("experience", analyzedData.experience);
    formData.append("match", analyzedData.match);
    formData.append("matchedSkills", analyzedData.matchedSkills.join(", "));
    formData.append("missingSkills", analyzedData.missingSkills.join(", "));
    formData.append("jobId", jobId);
    formData.append("resume", resumeFile);

    fetch("https://hirex-backend-sio8.onrender.com/apply-job", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        msg.style.color = "green";
        msg.innerText = data.message || "Applied successfully! ✅";

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 1200);
    })
    .catch(() => {
        msg.style.color = "red";
        msg.innerText = "Server error! Please try again ❌";
        btn.disabled = false;
        btn.innerText = "Submit Application";
    });
}

// =============================================
// ✅ SKILL EXTRACTION
// =============================================
const skillMap = {
    html:       ["html", "html5"],
    css:        ["css", "css3"],
    javascript: ["javascript", "js"],
    react:      ["react", "reactjs"],
    nodejs:     ["node", "nodejs", "node.js"],
    python:     ["python"],
    java:       ["java"],
    sql:        ["sql", "mysql", "postgresql"],
    mongodb:    ["mongodb", "mongo"],
    git:        ["git", "github"],
    ds:         ["ds", "data structures", "dsa"],
    typescript: ["typescript", "ts"],
    php:        ["php"],
    flutter:    ["flutter", "dart"],
    kotlin:     ["kotlin"],
    swift:      ["swift"],
    aws:        ["aws", "amazon web services"],
    docker:     ["docker"],
    c:          ["c programming", "c language"],
    cpp:        ["c++", "cpp"]
};

function extractSkills(text) {
    text = text.toLowerCase();
    let skills = [];
    for (let skill in skillMap) {
        for (let keyword of skillMap[skill]) {
            let regex = new RegExp("\\b" + keyword.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + "\\b", "i");
            if (regex.test(text)) {
                skills.push(skill);
                break;
            }
        }
    }
    return skills;
}

function extractExperience(text) {
    let match = text.match(/(\d+)\s*(year|years|yr|yrs)/i);
    return match ? parseInt(match[1]) : 0;
}

// =============================================
// ✅ LOGOUT
// =============================================
function logout() {
    localStorage.clear();
    window.location.href = "index.html";
}
</script>

</body>
</html>
