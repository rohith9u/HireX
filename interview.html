<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Schedule Interview</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<style>
@media (max-width: 768px) {
  .center-page { padding: 70px 14px 40px; }
  .register-card { padding: 24px 16px !important; }
  .apply-btn, .back-btn-premium { font-size: 15px; }
  .flatpickr-calendar { width: calc(100vw - 28px) !important; left: 14px !important; right: 14px !important; }
}

/* ✅ Disabled button state */
.apply-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
}
</style>
</head>

<body>
<div class="topbar">
    <img src="images/logo.png" class="logo-img">
</div>

<div class="center-page">
    <div class="register-card" style="max-width:500px;">

        <h2>📅 Schedule Interview</h2>

        <!-- ✅ Show which applicant this is for -->
        <p id="appInfo" style="color:#94a3b8; font-size:13px; margin-bottom:12px;"></p>

        <label>Select Date &amp; Time</label>
        <input type="text" id="interviewTime" placeholder="Select date &amp; time">

        <button id="scheduleBtn" onclick="scheduleInterview()" class="apply-btn" style="margin-top:16px;">
            Schedule Interview
        </button>

        <button onclick="goBack()" class="back-btn-premium" style="margin-top:10px;">
            ← Back
        </button>

    </div>
</div>

<div id="toast"></div>

<script>
// =============================================
// INIT flatpickr
// =============================================
flatpickr("#interviewTime", {
    enableTime: true,
    dateFormat: "Y-m-d H:i",
    minDate: "today",
    maxDate: new Date().fp_incr(30),
    minTime: "10:00",
    maxTime: "18:00",
    time_24hr: false
});

// ✅ Get appId from localStorage — set by employer.js
let appId = localStorage.getItem("selectedAppId");

// ✅ Guard: if no appId, go back
if (!appId) {
    showToast("No application selected ❌", "error");
    setTimeout(() => window.location.href = "employer.html", 1500);
}

// =============================================
// SCHEDULE INTERVIEW
// =============================================
function scheduleInterview() {
    let time = document.getElementById("interviewTime").value;
    let btn = document.getElementById("scheduleBtn");

    if (!time) {
        showToast("Please select a date & time ❌", "error");
        return;
    }

    if (!appId) {
        showToast("No application selected ❌", "error");
        return;
    }

    // ✅ Prevent double submit
    btn.disabled = true;
    btn.innerText = "Scheduling...";

    fetch("https://hirex-backend-sio8.onrender.com/schedule-interview", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ appId, interviewDate: time })
    })
    .then(res => res.json())
    .then(data => {
        if (data.success || data.message) {
            showToast("Interview Scheduled ✅");
            setTimeout(() => window.location.href = "employer.html", 1500);
        } else {
            showToast(data.error || "Failed to schedule ❌", "error");
            btn.disabled = false;
            btn.innerText = "Schedule Interview";
        }
    })
    .catch(() => {
        showToast("Server error ❌", "error");
        btn.disabled = false;
        btn.innerText = "Schedule Interview";
    });
}

function goBack() {
    window.location.href = "employer.html";
}

// =============================================
// TOAST
// =============================================
function showToast(message, type = "success") {
    let toast = document.getElementById("toast");
    toast.innerText = message;
    toast.className = "show";
    if (type === "error") toast.classList.add("error");
    setTimeout(() => toast.className = "", 3000);
}
</script>

</body>
</html>
